name: claude-validation

# Independent local test project. Never imports the production Compose file,
# Discord environment, account mount, or state.json.
services:
  probe:
    image: codex-ratelimite-bot:claude-validation
    build:
      context: ..
      dockerfile: Dockerfile
    platform: linux/arm64
    init: true
    user: "${CLAUDE_VALIDATION_UID:?Set local test UID}:${CLAUDE_VALIDATION_GID:?Set local test GID}"
    entrypoint: ["/usr/local/bin/codex-ratelimite-bot", "claude-poc"]
    environment:
      CLAUDE_CONFIG_DIR: /validation-profile
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"
      DISABLE_ERROR_REPORTING: "1"
    volumes:
      - ${CLAUDE_VALIDATION_DIR:?Set isolated local test directory}/profile:/validation-profile:rw
      - ${CLAUDE_VALIDATION_DIR:?Set isolated local test directory}/reports:/reports:rw
