services:
  codex-ratelimite-bot:
    build: .
    platform: linux/arm64
    init: true
    restart: unless-stopped
    user: "${HOST_UID:?Set HOST_UID in .env}:${HOST_GID:?Set HOST_GID in .env}"
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN in .env}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:?Set DISCORD_CHANNEL_ID in .env}
      ACCOUNTS_ROOT: /codex-accounts
      CONFIG_PATH: /config/config.json
      STATE_PATH: /data/state.json
    volumes:
      - ./config:/config:ro
      - ${HOME:?Set HOME}/.codex-accounts:/codex-accounts:rw
      - ./data:/data:rw
